[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "book-analyzer"
version = "0.1.0"
description = "Reads a limit order book message log on stdin and prints the cost to buy and income to sell a target size whenever either changes"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
book-analyzer = "book_analyzer.__main__:entry"
BookAnalyzer = "book_analyzer.__main__:entry"

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv.build-backend]
module-name = "book_analyzer"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["book_analyzer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/system holds helper modules (system_*.py) shared by its test modules; with importlib
# import mode and no __init__.py they are importable only through this path.
pythonpath = ["src", "tests/system"]
addopts = ["--import-mode=importlib"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
